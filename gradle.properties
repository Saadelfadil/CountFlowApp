# Build JVM. 4g is enough for a 14-module Compose build; parallel GC beats G1 for short-lived builds.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX only. Support library is not on the classpath at all.
android.useAndroidX=true

# Each module gets its own R class with only its own resources. Keeps R small and
# makes accidental cross-module resource access a compile error rather than a surprise.
android.nonTransitiveRClass=true

# AGP 9 ships built-in Kotlin support, which conflicts with applying the standard
# org.jetbrains.kotlin.android plugin. Opting out keeps CountFlow on the conventional
# Kotlin Gradle plugin, which is what KSP, Hilt, and the Compose compiler plugin are
# documented and tested against. Google's own platform-samples sets the same flag.
# Revisit once the built-in Kotlin path has ecosystem parity. See DECISIONS.md (D-005).
#
# TECH DEBT: both flags are deprecated and are removed in AGP 10. Migration to built-in
# Kotlin is required before upgrading past AGP 9.x. Tracked in KNOWN_ISSUES.md (TD-001).
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
